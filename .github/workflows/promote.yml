---
name: Promote release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Channel to promote to"
        type: choice
        options: [beta, stable]
        required: true
      source:
        description: "Source tag to promote from (e.g. staging or testing)"
        type: string
        default: testing
      version:
        description: "Optional release version (e.g. 1.0). Set when cutting a release: keeps an immutable :<version> tag as the permanent pin for the downloadable disk image."
        type: string
        default: ""

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.source }} -> ${{ inputs.target }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release signing config
        run: |
          set -euo pipefail
          # Release gate: fails closed before any registry read or write unless
          # this GitHub repository matches release.json image_repository and the
          # fork public key exists and is a valid public key.
          python3 .github/scripts/verify-release-config.py

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          need=""
          for tool in jq skopeo; do
            command -v "$tool" >/dev/null || need="$need $tool"
          done
          [ -z "$need" ] || { sudo apt-get update && sudo apt-get install -y $need; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify source container signature
        id: resolve
        run: |
          set -euxo pipefail
          REPO="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          # Same repository identity and release key as the build-time
          # self-verify and the on-device client policy.
          RELEASE_PUBKEY="system_files$(jq -r '.public_key_path' system_files/usr/share/armada/release.json)"
          # Pin to the digest so verify and the retag below act on the same image
          # even if a concurrent build re-points the source tag in between.
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${{ inputs.source }}")
          # Fail closed: never promote an unsigned or foreign-keyed build into beta/stable.
          cosign verify --key "${RELEASE_PUBKEY}" "${REPO}@${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Publish release tags
        run: |
          set -euxo pipefail
          REPO="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          SRC="${REPO}@${{ steps.resolve.outputs.digest }}"
          promote() { skopeo copy --all "docker://${SRC}" "docker://${REPO}:$1"; }

          promote "${{ inputs.target }}"

          # stable doubles as :latest for tooling that expects it.
          if [ "${{ inputs.target }}" = stable ]; then
            promote latest
          fi

          # Tag the release.
          if [ -n "${{ inputs.version }}" ]; then
            promote "${{ inputs.version }}"
          fi
